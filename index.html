
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NO FILTER GENERATION</title>
<style>
body {
  background: #101827;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 20px;
}
.container {
  max-width: 500px;
  margin: auto;
}
h1 { color: #38bdf8; }
textarea, select {
  width: 100%;
  box-sizing: border-box;
  padding: 14px;
  margin: 10px 0;
  border-radius: 10px;
  border: none;
  font-size: 16px;
}
textarea { height: 110px; }
button {
  background: #0284c7;
  color: white;
  border: 0;
  padding: 14px 20px;
  margin: 8px;
  border-radius: 8px;
  font-size: 16px;
}
#result {
  background: #1e293b;
  padding: 15px;
  margin-top: 20px;
  border-radius: 10px;
  text-align: left;
  white-space: pre-wrap;
}
</style>
</head>
<body>
<div class="container">
<h1>NO FILTER GENERATION</h1>
<h3>AI YouTube Automation</h3>
<p>Create YouTube Shorts Scripts</p>

<textarea id="topic" placeholder="Enter your video topic..."></textarea>

<select id="language">
<option value="English">English</option>
<option value="Urdu">Urdu</option>
</select>

<button onclick="generate()">Generate Script</button>
<button onclick="copyScript()">Copy Script</button>

<div id="result">Your script will appear here.</div>
</div>

<script>
function generate() {
 const topic = document.getElementById("topic").value.trim();
 const language = document.getElementById("language").value;

 if (!topic) {
   alert("Please enter a topic!");
   return;
 }

 const script =
`TITLE: ${topic}

HOOK:
What if everything you know about ${topic} is wrong?

MAIN SCRIPT:
Today, we are exploring ${topic}.
There is more to this subject than most people realize.
Let's look at the facts, understand the details, and discover why it matters.

ENDING:
Now you know something new about ${topic}.
Follow NO FILTER GENERATION for more interesting videos!

Language: ${language}
Format: YouTube Shorts
Estimated duration: 30-45 seconds`;

 document.getElementById("result").textContent = script;
}

function copyScript() {
 const text = document.getElementById("result").textContent;
 if (text === "Your script will appear here.") {
   alert("Generate a script first!");
   return;
 }
 navigator.clipboard.writeText(text)
 .then(() => alert("Script copied!"))
 .catch(() => alert("Please select and copy the script manually."));
}
</script>
</body>
</html>
